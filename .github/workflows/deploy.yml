name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 00:00 UTC every Sunday to update publications and collaborators
    - cron: "0 0 * * 0"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build
        env:
          # If you have any environment variables for your build script, add them here
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (Resilient Batch Mode)
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          set ssl:verify-certificate no;
          set net:connection-limit 1;
          set net:max-retries 3;
          set net:timeout 20;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} -p 21 ${{ secrets.FTP_SERVER }};
          mirror -R ./dist/ public_html/ --parallel=1 --verbose;
          quit
          "
