name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 00:00 UTC every Sunday to update publications and collaborators
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build
        env:
          # If you have any environment variables for your build script, add them here
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./ # Adjust this if you want to upload to a specific subfolder
          protocol: ftp # Or ftps if supported by your Hostinger plan
          port: 21
