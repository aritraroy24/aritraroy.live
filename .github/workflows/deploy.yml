name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 00:00 UTC every Sunday to update publications and collaborators
    - cron: "0 0 * * 0"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build
        env:
          # If you have any environment variables for your build script, add them here
          NODE_OPTIONS: "--max-old-space-size=4096"
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (Resilient Batch Mode)
        run: |
          lftp <<EOF
          set ftp:ssl-allow no
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:connection-limit 1
          set net:max-retries 20
          set net:timeout 60
          set net:reconnect-interval-base 5
          open ${{ secrets.FTP_SERVER }}
          user "${{ secrets.FTP_USERNAME }}" "${{ secrets.FTP_PASSWORD }}"
          mirror -R ./dist/ ./public_html/ --parallel=1 --verbose
          put -O ./public_html/ ./contact.php
          put -O ./public_html/ ./turnstile-verify.php
          quit
          EOF
